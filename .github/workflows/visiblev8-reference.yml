name: Original VisibleV8 conformance
on:
  pull_request:
    paths:
      - 'reference/**'
      - 'tests_reference/**'
      - '.github/workflows/visiblev8-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-visiblev8-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  v8-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/.reference-ccache
      DEPOT_TOOLS_UPDATE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: wspr-ncsu/visiblev8
          ref: 068c617f28686f5c43d27c891803cd21510aa141
          path: original-visiblev8
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential ccache ninja-build pkg-config curl git zstd libglib2.0-dev libnss3-dev
          ccache -M 2G
          df -h /
          free -h
          getconf _NPROCESSORS_ONLN
      - name: Prepare exact V8 and tools revisions
        run: python reference/build_visiblev8_reference.py --reference original-visiblev8 --work .reference-shell-work --output reference-shell --target v8-shell --phase prepare
      - uses: actions/cache/restore@v4
        with:
          path: .reference-ccache
          key: original-v8-shell-${{ hashFiles('reference/visiblev8.json', 'reference/build_visiblev8_reference.py', 'reference/engine_build_compat.py') }}
          restore-keys: original-v8-shell-
      - name: Compile the original VisibleV8 shell
        run: python reference/build_visiblev8_reference.py --reference original-visiblev8 --work .reference-shell-work --output reference-shell --target v8-shell --phase build --jobs 2
      - name: Run all nine original goldens and optimized loop checks
        run: |
          sudo ln -s "$GITHUB_WORKSPACE/original-visiblev8/tests/src" /testsrc
          python reference/reference_conformance.py shell --reference original-visiblev8 --shell reference-shell/bin/v8_shell --output reference-shell/runtime
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .reference-ccache
          key: original-v8-shell-${{ hashFiles('reference/visiblev8.json', 'reference/build_visiblev8_reference.py', 'reference/engine_build_compat.py') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-visiblev8-v8-shell-evidence
          path: |
            reference-shell/logs/
            reference-shell/runtime/
            reference-shell/build-report.json
            reference-shell/bin/provenance.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-visiblev8-v8-shell
          path: reference-shell/
          retention-days: 14
          if-no-files-found: error
  headless-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CCACHE_DIR: ${{ github.workspace }}/.reference-ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_DIRECT: 'true'
      CCACHE_DEPEND: 'true'
      CCACHE_SLOPPINESS: modules
      CCACHE_STATSLOG: ${{ github.workspace }}/reference-browser/logs/ccache-statistics.log
      CCACHE_EXTRAFILES: ${{ github.workspace }}/.reference-browser-work/src/out/Reference/obj/build/modules/system/module.pcm:${{ github.workspace }}/.reference-browser-work/src/out/Reference/clang_x64_for_rust_host_build_tools/obj/build/modules/system/module.pcm
      DEPOT_TOOLS_UPDATE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reclaim space for one Linux Chromium target
        uses: AdityaGarg8/remove-unwanted-software@8831c82abf29b34eb2caac48d5f999ecfc0d8eef
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-cached-tools: 'true'
          remove-swapfile: 'true'
      - uses: actions/checkout@v4
        with:
          repository: wspr-ncsu/visiblev8
          ref: 068c617f28686f5c43d27c891803cd21510aa141
          path: original-visiblev8
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check out the immutable optimizer provider
        uses: actions/checkout@v4
        with:
          repository: TonyChen-SH/camoufox-reverse
          ref: ef5e668a4bceb20c4de5f6df32a070e5b97e3514
          path: optimizer-provider
          sparse-checkout: optimizer-profile
          persist-credentials: false
      - name: Install browser build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential ccache ninja-build pkg-config curl git zstd libglib2.0-dev libnss3-dev libfontconfig1-dev libfreetype-dev libdbus-1-dev libx11-dev libxcomposite-dev libxdamage-dev libxext-dev libxi-dev libxrandr-dev libxcursor-dev libxfixes-dev libxkbcommon-dev libdrm-dev libgbm-dev libasound2-dev libcups2-dev libpulse-dev libudev-dev libgtk-3-dev libpango1.0-dev libatspi2.0-dev fonts-liberation
          ccache -M 2G
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /
          free -h
          getconf _NPROCESSORS_ONLN
      - name: Prepare exact Chromium, V8 and tools revisions
        run: python reference/build_visiblev8_reference.py --reference original-visiblev8 --work .reference-browser-work --output reference-browser --target headless-shell --phase prepare
      - uses: actions/cache/restore@v4
        with:
          path: .reference-ccache
          key: original-chromium-headless-${{ hashFiles('reference/visiblev8.json', 'reference/build_visiblev8_reference.py', 'reference/engine_build_compat.py', 'reference/cache_probe.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            original-chromium-headless-${{ hashFiles('reference/visiblev8.json', 'reference/build_visiblev8_reference.py', 'reference/engine_build_compat.py', 'reference/cache_probe.py') }}-
            original-chromium-headless-
      - name: Record actual module cache settings
        run: |
          ccache -M 4G
          ccache --version > reference-browser/logs/ccache-version.txt
          ccache --show-config > reference-browser/logs/ccache-config.txt
      - name: Compile one Linux headless browser
        run: python reference/build_visiblev8_reference.py --reference original-visiblev8 --work .reference-browser-work --output reference-browser --target headless-shell --phase build --jobs 4
      - name: Preserve original runtime evidence and incrementally verify the repair
        run: python reference/browser_profiles.py --reference original-visiblev8 --optimizer-provider optimizer-provider --work .reference-browser-work --original reference-browser --repaired reference-browser-repaired --jobs 4
      - name: Record actual cache, output and resource usage
        if: always()
        run: |
          mkdir -p reference-browser/logs
          ccache --show-stats --verbose --verbose > reference-browser/logs/ccache-stats.txt
          if test -f "$CCACHE_STATSLOG"; then ccache --show-log-stats --verbose > reference-browser/logs/ccache-build-stats.txt; fi
          for path in .reference-ccache .reference-browser-work/src/out/Reference; do
            if test -d "$path"; then du -sh "$path"; fi
          done > reference-browser/logs/build-disk-usage.txt
          df -h / >> reference-browser/logs/build-disk-usage.txt
          free -h > reference-browser/logs/build-memory.txt
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .reference-ccache
          key: original-chromium-headless-${{ hashFiles('reference/visiblev8.json', 'reference/build_visiblev8_reference.py', 'reference/engine_build_compat.py', 'reference/cache_probe.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-visiblev8-headless-shell-evidence
          path: |
            reference-browser/logs/
            reference-browser/runtime/
            reference-browser/build-report.json
            reference-browser/bin/provenance.json
            reference-browser/profiles-report.json
            reference-browser/runtime-classification.json
            reference-browser/strict-runtime.stdout
            reference-browser/strict-runtime.stderr
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-visiblev8-headless-shell
          path: reference-browser/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-visiblev8-headless-shell-evidence
          path: |
            reference-browser-repaired/logs/
            reference-browser-repaired/runtime/
            reference-browser-repaired/build-report.json
            reference-browser-repaired/bin/provenance.json
            reference-browser-repaired/strict-runtime.stdout
            reference-browser-repaired/strict-runtime.stderr
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-visiblev8-headless-shell
          path: reference-browser-repaired/
          retention-days: 14
          if-no-files-found: error
