name: Repaired VisibleV8 optimizer native gate
on:
  pull_request:
    paths:
      - 'optimizer-profile/**'
      - '.github/workflows/visiblev8-optimizer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repaired-visiblev8-optimizer-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  repaired-v8-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/.reference-ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_STATSLOG: ${{ github.workspace }}/optimizer-evidence/logs/ccache-statistics.log
      DEPOT_TOOLS_UPDATE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: wspr-ncsu/visiblev8
          ref: 068c617f28686f5c43d27c891803cd21510aa141
          path: original-visiblev8
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the original source-build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential ccache ninja-build pkg-config curl git zstd libglib2.0-dev libnss3-dev
          df -h /
          free -h
          getconf _NPROCESSORS_ONLN
      - name: Prepare pinned inputs and verify the source repair
        run: python optimizer-profile/build.py --reference original-visiblev8 --work .reference-optimizer-work --output optimizer-evidence --phase prepare
      - uses: actions/cache/restore@v4
        with:
          path: .reference-ccache
          key: repaired-v8-optimizer-${{ hashFiles('reference/visiblev8.json', 'reference/build_visiblev8_reference.py', 'reference/engine_build_compat.py', 'optimizer-profile/repair.py', 'optimizer-profile/build.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            repaired-v8-optimizer-${{ hashFiles('reference/visiblev8.json', 'reference/build_visiblev8_reference.py', 'reference/engine_build_compat.py', 'optimizer-profile/repair.py', 'optimizer-profile/build.py') }}-
            repaired-v8-optimizer-
            original-v8-shell-
      - name: Record compiler cache configuration
        run: |
          ccache -M 4G
          ccache -z
          ccache --version > optimizer-evidence/logs/ccache-version.txt
          ccache --show-config > optimizer-evidence/logs/ccache-config.txt
      - name: Compile the explicitly repaired shell
        run: python optimizer-profile/build.py --reference original-visiblev8 --work .reference-optimizer-work --output optimizer-evidence --phase build --jobs 4
      - name: Require exact goldens, full counts, real JIT tiers, offsets and Wasm
        run: |
          sudo ln -s "$GITHUB_WORKSPACE/original-visiblev8/tests/src" /testsrc
          python optimizer-profile/conformance.py --reference original-visiblev8 --shell optimizer-evidence/bin/v8_shell --output optimizer-evidence/runtime
      - name: Record actual cache and disk usage
        if: always()
        run: |
          mkdir -p optimizer-evidence/logs
          ccache --show-stats --verbose --verbose > optimizer-evidence/logs/ccache-stats.txt
          if test -f "$CCACHE_STATSLOG"; then ccache --show-log-stats --verbose > optimizer-evidence/logs/ccache-build-stats.txt; fi
          du -sh .reference-ccache .reference-optimizer-work/v8/out/Reference > optimizer-evidence/logs/build-disk-usage.txt
          df -h / >> optimizer-evidence/logs/build-disk-usage.txt
          free -h > optimizer-evidence/logs/build-memory.txt
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .reference-ccache
          key: repaired-v8-optimizer-${{ hashFiles('reference/visiblev8.json', 'reference/build_visiblev8_reference.py', 'reference/engine_build_compat.py', 'optimizer-profile/repair.py', 'optimizer-profile/build.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-visiblev8-optimizer-evidence
          path: |
            optimizer-evidence/logs/
            optimizer-evidence/runtime/
            optimizer-evidence/build-report.json
            optimizer-evidence/bin/provenance.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-visiblev8-optimizer-shell
          path: optimizer-evidence/
          retention-days: 14
          if-no-files-found: error
