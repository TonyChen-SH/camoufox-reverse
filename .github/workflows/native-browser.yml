name: Native browser build and runtime
on:
  pull_request:
    paths:
      - 'additions/**'
      - 'patches/**'
      - 'tools/**'
      - 'examples/**'
      - 'baseline.json'
      - 'runtime-base.json'
      - '.github/workflows/native-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read
    env:
      BUILD_TARGET: linux,x86_64
      CARGO_BUILD_JOBS: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select explicit runtime composition mode
        id: runtime_base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/runtime_base.py select --config runtime-base.json --selection .runtime-base-selection.json --github-output "$GITHUB_OUTPUT"
      - name: Restore identical compiled browser
        id: binary_cache
        if: steps.runtime_base.outputs.enabled == 'false'
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: browser-158-linux-v2-${{ hashFiles('additions/**', 'patches/**', 'baseline.json', 'tools/binding_inventory.py') }}
      - name: Reclaim build space
        if: steps.runtime_base.outputs.enabled == 'false' && steps.binary_cache.outputs.cache-hit != 'true'
        uses: AdityaGarg8/remove-unwanted-software@8831c82abf29b34eb2caac48d5f999ecfc0d8eef
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-cached-tools: 'true'
          remove-swapfile: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout exact compiled-base source
        if: steps.runtime_base.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.runtime_base.outputs.repository }}
          ref: ${{ steps.runtime_base.outputs.head_sha }}
          path: .runtime-base-checkout
          persist-credentials: false
      - name: Download the selected compiled candidate
        if: steps.runtime_base.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.runtime_base.outputs.artifact_id }}
          merge-multiple: true
          repository: ${{ steps.runtime_base.outputs.repository }}
          run-id: ${{ steps.runtime_base.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .runtime-base-download
      - name: Authenticate original artifact bytes and extraction
        if: steps.runtime_base.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/runtime_base.py authenticate --selection .runtime-base-selection.json --downloaded .runtime-base-download --receipt .runtime-base-authentication.json
          (cd .runtime-base-download && sha256sum --check SHA256SUMS)
          cmp .runtime-base-download/baseline.json .runtime-base-checkout/baseline.json
      - name: Compose only the generated runtime asset
        if: steps.runtime_base.outputs.enabled == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd
          python tools/fetch_test_source.py .runtime-pristine
          mkdir .runtime-package
          zstd -d -c .runtime-base-download/camoufox-trace-linux-x86_64.tar.zst | tar --same-permissions -C .runtime-package -xf -
          cp .runtime-base-download/baseline.json .runtime-package/baseline.json
          python - <<'PYTHON'
          import json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from update_runtime_asset import CORE_FILES, sha256, update
          package = Path('.runtime-package')
          authentication = json.loads(Path('.runtime-base-authentication.json').read_text())
          identity = {
              'artifact': authentication['selection']['artifact'],
              'baseline_sha256': sha256(package / 'baseline.json'),
              'core_sha256': {path: sha256(package / path) for path in CORE_FILES},
          }
          target = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          update(package, Path('.runtime-pristine'), identity, target, Path('.runtime-composition.json'))
          PYTHON
          mkdir dist
          tar -C .runtime-package -cf - bin | zstd -3 -T0 -o dist/camoufox-trace-linux-x86_64.tar.zst
          cp .runtime-package/baseline.json dist/baseline.json
          cp .runtime-base-download/binding-inventory.json dist/binding-inventory.json
          cp baseline.json dist/runtime-baseline.json
          cp runtime-base.json dist/runtime-base.json
          cp .runtime-composition.json dist/runtime-composition.json
          cp .runtime-base-authentication.json dist/base-artifact-authentication.json
          cp .runtime-base-selection.json dist/base-artifact-identity.json
      - uses: actions/checkout@v4
        if: steps.runtime_base.outputs.enabled == 'false'
        with:
          repository: daijro/camoufox
          ref: b6205b0ee1e4c2e8e4bb9eb0e084472028a9c6a3
          path: upstream
          persist-credentials: false
      - name: Install build and browser prerequisites
        if: steps.runtime_base.outputs.enabled == 'false' && steps.binary_cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            aria2 msitools p7zip-full ccache libsqlite3-dev clang-18 lld-18 \
            xvfb xauth libgtk-3-0 libasound2t64 libdbus-glib-1-2 libx11-xcb1 \
            libxcb-shm0 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 \
            libxi6 libxrandr2 libxtst6 libpci3 libegl1 libgl1-mesa-dri zstd
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /
      - name: Restore native compiler cache
        if: steps.runtime_base.outputs.enabled == 'false' && steps.binary_cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .ccache
            ~/.mozbuild
          key: native-158-linux-${{ hashFiles('additions/**', 'patches/**', 'baseline.json') }}
          restore-keys: native-158-linux-
      - name: Prepare complete Camoufox source
        if: steps.runtime_base.outputs.enabled == 'false' && steps.binary_cache.outputs.cache-hit != 'true'
        working-directory: upstream
        run: |
          ccache -M 4G
          python3 -m ci.run_prepare
      - name: Apply and compile native tracer
        if: steps.runtime_base.outputs.enabled == 'false' && steps.binary_cache.outputs.cache-hit != 'true'
        run: |
          python tools/apply.py --source upstream/browser/camoufox-158.0.1-beta.34
          make -C upstream/browser build
      - name: Save native compiler cache
        if: always() && steps.runtime_base.outputs.enabled == 'false' && steps.binary_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ccache
            ~/.mozbuild
          key: native-158-linux-${{ hashFiles('additions/**', 'patches/**', 'baseline.json') }}
      - name: Stage complete browser resources
        if: steps.runtime_base.outputs.enabled == 'false' && steps.binary_cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/binding_inventory.py \
            --root upstream/browser/camoufox-158.0.1-beta.34/obj-x86_64-pc-linux-gnu/dom/bindings \
            --output dist/binding-inventory.json
          make -C upstream/browser stage-fonts
          src=upstream/browser/camoufox-158.0.1-beta.34/obj-x86_64-pc-linux-gnu/dist/bin
          test -x "$src/camoufox-bin"
          test -f "$src/properties.json" || cp upstream/browser/settings/properties.json "$src/properties.json"
          python upstream/browser/scripts/fetch-ubo.py stage "$src"
          for required in camoufox.cfg fonts/groups.json fontconfig/linux addons/UBO/manifest.json; do
            test -e "$src/$required"
          done
          echo "CAMOUFOX_BINARY=$(realpath "$src/camoufox-bin")" >> "$GITHUB_ENV"
      - name: Package browser candidate
        if: steps.runtime_base.outputs.enabled == 'false' && steps.binary_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dist
          src=upstream/browser/camoufox-158.0.1-beta.34/obj-x86_64-pc-linux-gnu/dist
          tar -C "$src" --dereference -cf - bin | zstd -3 -T0 -o dist/camoufox-trace-linux-x86_64.tar.zst
          cp baseline.json dist/baseline.json
          cd dist
          sha256sum camoufox-trace-linux-x86_64.tar.zst baseline.json binding-inventory.json > SHA256SUMS
      - name: Cache this exact compiled browser
        if: steps.runtime_base.outputs.enabled == 'false' && steps.binary_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist
          key: browser-158-linux-v2-${{ hashFiles('additions/**', 'patches/**', 'baseline.json', 'tools/binding_inventory.py') }}
      - name: Bundle the local tracing example and license
        run: |
          mkdir -p dist/examples
          cp -R examples/. dist/examples/
          cp LICENSE dist/LICENSE
          python tools/runtime_base.py checksums --package dist
      - name: Upload small runtime composition proof
        if: steps.runtime_base.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-composition-proof
          path: |
            dist/baseline.json
            dist/runtime-baseline.json
            dist/runtime-composition.json
            dist/runtime-base.json
            dist/base-artifact-authentication.json
            dist/base-artifact-identity.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: camoufox-trace-candidate-linux-x86_64
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  browser-runtime:
    needs: linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      CI_RESULTS_DIR: ${{ github.workspace }}/evidence/upstream
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: daijro/camoufox
          ref: b6205b0ee1e4c2e8e4bb9eb0e084472028a9c6a3
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TonyChen-SH/camoufox-reverse-mcp
          ref: fabddde3cab06580f308ab9d4ba80a5b47a2895c
          path: analysis
          persist-credentials: false
      - name: Install runtime and SDK prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth xdotool x11-xkb-utils build-essential gnupg iproute2 util-linux \
            libgtk-3-0 libasound2t64 libdbus-glib-1-2 \
            libx11-xcb1 libxcb-shm0 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 \
            libxi6 libxrandr2 libxtst6 libpci3 libegl1 libgl1-mesa-dri zstd
          python -m pip install -r analysis/requirements-mcp.lock -r upstream/ci/requirements.txt
          python -m pip install --no-deps -e analysis
          python -m pip install 'playwright==1.62.0' -e upstream/python
          python upstream/python/scripts/pin-fpgen-model.py
          npm ci --prefix upstream/browser/tests/build-tester
      - uses: actions/download-artifact@v4
        with:
          name: camoufox-trace-candidate-linux-x86_64
          path: dist
      - name: Verify and unpack the built browser
        id: unpack
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          mkdir -p ../evidence
          cp binding-inventory.json ../evidence/binding-inventory.json
          cp baseline.json ../evidence/compiled-baseline.json
          mkdir -p ../.browser
          zstd -d -c camoufox-trace-linux-x86_64.tar.zst | tar --same-permissions -C ../.browser -xf -
          cp baseline.json ../.browser/baseline.json
          if test -f ../runtime-base.json; then
            cmp runtime-base.json ../runtime-base.json
            cmp runtime-baseline.json ../baseline.json
            cp runtime-baseline.json runtime-composition.json runtime-base.json base-artifact-authentication.json base-artifact-identity.json ../evidence/
            python ../tools/runtime_base.py verify --package ../.browser --receipt runtime-composition.json --target-baseline runtime-baseline.json
          elif test -f runtime-composition.json; then
            echo 'Unexpected runtime composition in compiled-browser mode' >&2
            exit 1
          fi
          test -x ../.browser/bin/camoufox-bin
          test -z "$(find ../.browser -xtype l -print -quit)"
          echo "CAMOUFOX_BINARY=$(realpath ../.browser/bin/camoufox-bin)" >> "$GITHUB_ENV"
      - name: Real browser trace and MCP round trip
        run: xvfb-run -a python tools/runtime_check.py --binary "$CAMOUFOX_BINARY" --output evidence/runtime
      - name: Engine operations, complete source and seven-tool MCP conformance
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        run: xvfb-run -a python tools/engine_runtime_check.py --binary "$CAMOUFOX_BINARY" --output evidence/engine
      - name: Complete upstream browser behaviour guards and fingerprint checks
        working-directory: upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CAMOUFOX_TRACE: '0'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a python -m ci.run_patch_guards --binary "$CAMOUFOX_BINARY"
          xvfb-run -a python -m ci.run_build_tester --binary "$CAMOUFOX_BINARY"
      - name: Attach runtime validation to the delivery
        run: |
          cp evidence/runtime/runtime-report.json dist/runtime-report.json
          cp evidence/engine/engine-runtime-report.json dist/engine-runtime-report.json
          cp evidence/upstream/patch_guards.json dist/patch-guards.json
          cp evidence/upstream/build_tester.json dist/build-tester.json
          python tools/runtime_base.py checksums --package dist
      - uses: actions/upload-artifact@v4
        with:
          name: camoufox-engine-trace-linux-x86_64
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-browser-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
