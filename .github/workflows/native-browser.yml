name: Native browser build and runtime
on:
  pull_request:
    paths:
      - 'additions/**'
      - 'patches/**'
      - 'tools/**'
      - 'examples/**'
      - 'baseline.json'
      - '.github/workflows/native-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      BUILD_TARGET: linux,x86_64
      CARGO_BUILD_JOBS: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore identical compiled browser
        id: binary_cache
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: browser-158-linux-v2-${{ hashFiles('additions/**', 'patches/**', 'baseline.json', 'tools/binding_inventory.py') }}
      - name: Reclaim build space
        if: steps.binary_cache.outputs.cache-hit != 'true'
        uses: AdityaGarg8/remove-unwanted-software@8831c82abf29b34eb2caac48d5f999ecfc0d8eef
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-cached-tools: 'true'
          remove-swapfile: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: daijro/camoufox
          ref: b6205b0ee1e4c2e8e4bb9eb0e084472028a9c6a3
          path: upstream
          persist-credentials: false
      - name: Install build and browser prerequisites
        if: steps.binary_cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            aria2 msitools p7zip-full ccache libsqlite3-dev clang-18 lld-18 \
            xvfb xauth libgtk-3-0 libasound2t64 libdbus-glib-1-2 libx11-xcb1 \
            libxcb-shm0 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 \
            libxi6 libxrandr2 libxtst6 libpci3 libegl1 libgl1-mesa-dri zstd
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /
      - name: Restore native compiler cache
        if: steps.binary_cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .ccache
            ~/.mozbuild
          key: native-158-linux-${{ hashFiles('additions/**', 'patches/**', 'baseline.json') }}
          restore-keys: native-158-linux-
      - name: Prepare complete Camoufox source
        if: steps.binary_cache.outputs.cache-hit != 'true'
        working-directory: upstream
        run: |
          ccache -M 4G
          python3 -m ci.run_prepare
      - name: Apply and compile native tracer
        if: steps.binary_cache.outputs.cache-hit != 'true'
        run: |
          python tools/apply.py --source upstream/browser/camoufox-158.0.1-beta.34
          make -C upstream/browser build
      - name: Save native compiler cache
        if: always() && steps.binary_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ccache
            ~/.mozbuild
          key: native-158-linux-${{ hashFiles('additions/**', 'patches/**', 'baseline.json') }}
      - name: Stage complete browser resources
        if: steps.binary_cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/binding_inventory.py \
            --root upstream/browser/camoufox-158.0.1-beta.34/obj-x86_64-pc-linux-gnu/dom/bindings \
            --output dist/binding-inventory.json
          make -C upstream/browser stage-fonts
          src=upstream/browser/camoufox-158.0.1-beta.34/obj-x86_64-pc-linux-gnu/dist/bin
          test -x "$src/camoufox-bin"
          test -f "$src/properties.json" || cp upstream/browser/settings/properties.json "$src/properties.json"
          python upstream/browser/scripts/fetch-ubo.py stage "$src"
          for required in camoufox.cfg fonts/groups.json fontconfig/linux addons/UBO/manifest.json; do
            test -e "$src/$required"
          done
          echo "CAMOUFOX_BINARY=$(realpath "$src/camoufox-bin")" >> "$GITHUB_ENV"
      - name: Package browser candidate
        if: steps.binary_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dist
          src=upstream/browser/camoufox-158.0.1-beta.34/obj-x86_64-pc-linux-gnu/dist
          tar -C "$src" --dereference -cf - bin | zstd -3 -T0 -o dist/camoufox-trace-linux-x86_64.tar.zst
          cp baseline.json dist/baseline.json
          cd dist
          sha256sum camoufox-trace-linux-x86_64.tar.zst baseline.json binding-inventory.json > SHA256SUMS
      - name: Cache this exact compiled browser
        if: steps.binary_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist
          key: browser-158-linux-v2-${{ hashFiles('additions/**', 'patches/**', 'baseline.json', 'tools/binding_inventory.py') }}
      - name: Bundle the local tracing example and license
        run: |
          mkdir -p dist/examples
          cp -R examples/. dist/examples/
          cp LICENSE dist/LICENSE
          cd dist
          sha256sum camoufox-trace-linux-x86_64.tar.zst baseline.json binding-inventory.json \
            LICENSE examples/* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: camoufox-trace-candidate-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 14
  browser-runtime:
    needs: linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      CI_RESULTS_DIR: ${{ github.workspace }}/evidence/upstream
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: daijro/camoufox
          ref: b6205b0ee1e4c2e8e4bb9eb0e084472028a9c6a3
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TonyChen-SH/camoufox-reverse-mcp
          ref: df2ce2f8cd631ad920409e79156e8d0f51837fca
          path: analysis
          persist-credentials: false
      - name: Install runtime and SDK prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth xdotool x11-xkb-utils build-essential gnupg iproute2 util-linux \
            libgtk-3-0 libasound2t64 libdbus-glib-1-2 \
            libx11-xcb1 libxcb-shm0 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 \
            libxi6 libxrandr2 libxtst6 libpci3 libegl1 libgl1-mesa-dri zstd
          python -m pip install -r analysis/requirements-mcp.lock -r upstream/ci/requirements.txt
          python -m pip install --no-deps -e analysis
          python -m pip install 'playwright==1.62.0' -e upstream/python
          python upstream/python/scripts/pin-fpgen-model.py
          npm ci --prefix upstream/browser/tests/build-tester
      - uses: actions/download-artifact@v4
        with:
          name: camoufox-trace-candidate-linux-x86_64
          path: dist
      - name: Verify and unpack the built browser
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          mkdir -p ../evidence
          cp binding-inventory.json ../evidence/binding-inventory.json
          mkdir -p ../.browser
          zstd -d -c camoufox-trace-linux-x86_64.tar.zst | tar -C ../.browser -xf -
          test -x ../.browser/bin/camoufox-bin
          test -z "$(find ../.browser -xtype l -print -quit)"
          echo "CAMOUFOX_BINARY=$(realpath ../.browser/bin/camoufox-bin)" >> "$GITHUB_ENV"
      - name: Real browser trace and MCP round trip
        run: xvfb-run -a python tools/runtime_check.py --binary "$CAMOUFOX_BINARY" --output evidence/runtime
      - name: Engine operations, complete source and seven-tool MCP conformance
        run: xvfb-run -a python tools/engine_runtime_check.py --binary "$CAMOUFOX_BINARY" --output evidence/engine
      - name: Complete upstream browser behaviour guards and fingerprint checks
        working-directory: upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CAMOUFOX_TRACE: '0'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a python -m ci.run_patch_guards --binary "$CAMOUFOX_BINARY"
          xvfb-run -a python -m ci.run_build_tester --binary "$CAMOUFOX_BINARY"
      - name: Attach runtime validation to the delivery
        run: |
          cp evidence/runtime/runtime-report.json dist/runtime-report.json
          cp evidence/engine/engine-runtime-report.json dist/engine-runtime-report.json
          cp evidence/upstream/patch_guards.json dist/patch-guards.json
          cp evidence/upstream/build_tester.json dist/build-tester.json
          cd dist
          sha256sum camoufox-trace-linux-x86_64.tar.zst baseline.json binding-inventory.json \
            runtime-report.json engine-runtime-report.json patch-guards.json build-tester.json LICENSE examples/* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: camoufox-engine-trace-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-browser-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
